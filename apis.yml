name: Ahana
description: 'Ahana was a venture-backed SaaS company founded in 2020 and headquartered in San Mateo,
  California, that provided a managed, cloud-native offering of PrestoDB — the open source distributed
  SQL query engine originally created at Facebook — positioned as the query and analytics layer of the
  open data lakehouse. Ahana raised roughly $32M in seed and Series A funding from investors including
  GV (Google Ventures), Lux Capital, Third Point Ventures, Leslie Ventures, and Liberty Global Ventures,
  and was a leading contributor and steward of the Presto Foundation. In April 2023 Ahana was acquired
  by IBM, which joined the Presto Foundation and folded Ahana''s SaaS Presto capabilities into IBM
  watsonx.data. The independent Ahana product and developer surface no longer exist: the ahana.io domain
  now 301-redirects to https://www.ibm.com/products/watsonx-data. This profile is retained as a historical
  network record for the acquired company; there is no live first-party API to enrich.'
